steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, email_agent/Dockerfile, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/email:${_TAG}', .]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, tourism_agent/Dockerfile, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tourism:${_TAG}', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/email:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tourism:${_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: us-central1
  _REPOSITORY: example-agents
  _TAG: pending-explicit-approved-build
