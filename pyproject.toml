[project]
name = "colombia-two-agents"
version = "0.1.0"
description = "Dos agentes independientes y acotados para una clase sobre Colombia con A2A 1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "a2a-sdk[fastapi]==1.2.2", "fastapi==0.142.2", "uvicorn==0.54.0",
  "pydantic==2.13.5", "httpx==0.28.1", "email-validator==2.3.0",
  "langgraph==1.2.13", "langchain-core==1.6.6",
  "langchain-google-genai==4.4.0", "mcp==2.3.0", "google-auth==2.60.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
