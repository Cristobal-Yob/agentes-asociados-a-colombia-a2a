name: Verificar las dos APIs

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COLOMBIA_WORK_DIR: ${{ runner.temp }}/colombia-runtime
    steps:
      - name: Obtener el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar uv y Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          python-version: '3.12'
          enable-cache: false
      - name: Instalar exactamente el lockfile
        run: uv sync --frozen --python 3.12 --all-groups --no-install-project
      - name: Comprobar Ruff
        run: uv run --frozen --no-sync python -B -m ruff check .
      - name: Comprobar formato
        run: uv run --frozen --no-sync python -B -m ruff format --check .
      - name: Ejecutar pruebas herméticas
        run: uv run --frozen --no-sync python -B -m pytest -q
      - name: Regenerar contratos sin proveedores
        run: uv run --frozen --no-sync python -B -m scripts.export_contracts
      - name: Comprobar contratos publicados
        run: git diff --exit-code -- docs/contracts
      - name: Comprobar los clientes de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_local_scripts.ps1 -PythonPath (Resolve-Path '.venv/Scripts/python.exe').Path
